name: premier-parts

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: premier
      POSTGRES_USER: premier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premier}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premier -d premier"]
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.54
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "7701:7700"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://premier:${POSTGRES_PASSWORD:-premier}@postgres:5432/premier
      MEILI_URL: http://meilisearch:7700
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      MEDIA_ROOT: /data/media
      IMPORT_CACHE_DIR: /data/cache
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/data/media
      - importcache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  meilidata:
  media:
  importcache:
  frontend_node_modules:
  frontend_next:
